<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <header class="header">
        <div class="nav-left">
            <a href="{{ url_for('home') }}" class="brand">Capstone Project</a>
            <a href="{{ url_for('main_form_page') }}" class="btn btn-light">Input here</a>
        </div>
        <div class="nav-right">
            <a href="{{ url_for('login_page') }}" class="btn btn-light">Login</a>
        </div>
    </header>
    <div class="container">
        <h2>Login</h2>
        <form method="POST" action="{{ url_for('login') }}">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="btn">Login</button>
        </form>
        <p>Don't have an account? <a href="{{ url_for('register_page') }}">Register</a></p>
    </div>
</body>

</html>
